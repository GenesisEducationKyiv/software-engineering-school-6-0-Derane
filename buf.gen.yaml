version: v2
# Scope codegen to the welcome proto only. The legacy proto/release_notifier.proto is
# generated by `make proto` into committed generated/; re-emitting it here would duplicate
# the Grpc\ReleaseNotifier\V1 classes already mapped to generated/.
inputs:
  - directory: proto
    paths:
      - proto/notification/welcome/v1/welcome.proto
managed:
  enabled: false   # php_namespace is set explicitly in the proto
plugins:
  # Protobuf message classes: no standalone protoc-gen-php binary exists (it's a protoc
  # builtin), so this uses the remote plugin.
  - remote: buf.build/protocolbuffers/php:v29.3
    out: gen
  # Service B server interface — vendored Spiral plugin.
  - local: tools/bin/protoc-gen-php-grpc-2025.1.12-linux-amd64/protoc-gen-php-grpc
    out: gen
  # Service A client stub.
  - remote: buf.build/grpc/php:v1.69.0
    out: gen
