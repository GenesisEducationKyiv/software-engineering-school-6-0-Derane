imports:
  - deptrac.baseline.yaml

deptrac:
  paths:
    - ./src
    - ./apps
  exclude_files:
    - '#apps/[^/]+/vendor/.*#'

  layers:
    # ---------------------------------------------------------------------
    # Shared kernel
    # ---------------------------------------------------------------------
    - name: Shared.Domain
      collectors:
        - type: directory
          value: src/Shared/Domain/.*
    - name: Shared.Application
      collectors:
        - type: directory
          value: src/Shared/Application/.*
    - name: Shared.Infrastructure
      collectors:
        - type: directory
          value: src/Shared/Infrastructure/.*

    # ---------------------------------------------------------------------
    # Subscription context (module: Subscriptions)
    # ---------------------------------------------------------------------
    - name: Subscription.Domain
      collectors:
        - type: directory
          value: src/Subscription/Subscriptions/Domain/.*
    - name: Subscription.Application
      collectors:
        - type: directory
          value: src/Subscription/Subscriptions/Application/.*
    - name: Subscription.Infrastructure
      collectors:
        - type: directory
          value: src/Subscription/Subscriptions/Infrastructure/.*

    # ---------------------------------------------------------------------
    # RepositoryTracking context (module: Repositories)
    # ---------------------------------------------------------------------
    - name: RepositoryTracking.Domain
      collectors:
        - type: directory
          value: src/RepositoryTracking/Repositories/Domain/.*
    - name: RepositoryTracking.Application
      collectors:
        - type: directory
          value: src/RepositoryTracking/Repositories/Application/.*
    - name: RepositoryTracking.Infrastructure
      collectors:
        - type: directory
          value: src/RepositoryTracking/Repositories/Infrastructure/.*

    # ---------------------------------------------------------------------
    # Releases context (module: Sourcing)
    # ---------------------------------------------------------------------
    - name: Releases.Domain
      collectors:
        - type: directory
          value: src/Releases/Sourcing/Domain/.*
    - name: Releases.Application
      collectors:
        - type: directory
          value: src/Releases/Sourcing/Application/.*
    - name: Releases.Infrastructure
      collectors:
        - type: directory
          value: src/Releases/Sourcing/Infrastructure/.*

    # ---------------------------------------------------------------------
    # Scanning context (module: Scanner) — orchestration, NO Domain layer
    # ---------------------------------------------------------------------
    - name: Scanning.Application
      collectors:
        - type: directory
          value: src/Scanning/Scanner/Application/.*
    - name: Scanning.Infrastructure
      collectors:
        - type: directory
          value: src/Scanning/Scanner/Infrastructure/.*

    # ---------------------------------------------------------------------
    # Notification\Publishing context (monolith publisher side)
    # ---------------------------------------------------------------------
    - name: NotificationPublishing.Domain
      collectors:
        - type: directory
          value: src/Notification/Publishing/Domain/.*
    - name: NotificationPublishing.Application
      collectors:
        - type: directory
          value: src/Notification/Publishing/Application/.*
    - name: NotificationPublishing.Infrastructure
      collectors:
        - type: directory
          value: src/Notification/Publishing/Infrastructure/.*

    # ---------------------------------------------------------------------
    # Notification\Sending context (the EXTRACTED service's context)
    # ---------------------------------------------------------------------
    - name: NotificationSending.Domain
      collectors:
        - type: directory
          value: src/Notification/Sending/Domain/.*
    - name: NotificationSending.Application
      collectors:
        - type: directory
          value: src/Notification/Sending/Application/.*
    - name: NotificationSending.Infrastructure
      collectors:
        - type: directory
          value: src/Notification/Sending/Infrastructure/.*

    # ---------------------------------------------------------------------
    # apps/* deployables (composition roots / thin entrypoints)
    # ---------------------------------------------------------------------
    - name: Apps.Monolith
      collectors:
        - type: directory
          value: apps/monolith/.*
    - name: Apps.Notification
      collectors:
        - type: directory
          value: apps/notification/.*

    # ---------------------------------------------------------------------
    # Legacy flat code (transitional; drains over Epic B). Layer-only, no context.
    # ---------------------------------------------------------------------
    - name: Legacy.Domain
      collectors:
        # B5 drained both src/Domain/ and src/Exception/ (now deleted) — these
        # collectors match nothing. Kept because deptrac requires >= 1 collector
        # per layer and Legacy.{Application,Infrastructure} rulesets still grant
        # this layer; a follow-up can drop Legacy.Domain entirely once nothing
        # references it.
        - type: directory
          value: src/Domain/.*
        - type: directory
          value: src/Exception/.*
    - name: Legacy.Application
      collectors:
        - type: directory
          value: src/Validation/.*
    - name: Legacy.Infrastructure
      collectors:
        - type: directory
          value: src/Controller/.*
        - type: directory
          value: src/Grpc/.*
        - type: directory
          value: src/Repository/.*
        - type: directory
          value: src/Migration/.*
        - type: directory
          value: src/Factory/.*
        - type: directory
          value: src/Config/.*

  ruleset:
    # ===== Shared kernel: depended on by all; depends on nothing outside Shared.
    Shared.Domain: []                      # Domain purity (intra-layer allowed by default)
    Shared.Application:
      - Shared.Domain
    Shared.Infrastructure:
      - Shared.Domain
      - Shared.Application
      - Subscription.Domain         # B5: ExceptionStatusMap references SubscriptionNotFoundException; MetricsService uses SubscriptionCountPort
      - Releases.Domain             # B5: ExceptionStatusMap references RateLimitException
      - RepositoryTracking.Domain   # B5: MetricsService uses RepositoryCountPort

    # ===== Subscription
    Subscription.Domain:
      - Shared.Domain
    Subscription.Application:
      - Subscription.Domain
      - Shared.Domain
      - Shared.Application
      - Releases.Domain               # B1 grant: repositoryExists() port (GitHubServiceInterface)
      - RepositoryTracking.Domain     # B1 grant: ensureExists() port (TrackedRepositoryRegistrar)
      - Legacy.Application            # B1 transitional: SubscriptionValidator -> App\Validation\* (B5 removes when validators move)
    Subscription.Infrastructure:
      - Subscription.Domain
      - Subscription.Application
      - Shared.Domain
      - Shared.Application
      - Shared.Infrastructure

    # ===== RepositoryTracking
    RepositoryTracking.Domain:
      - Shared.Domain
    RepositoryTracking.Application:
      - RepositoryTracking.Domain
      - Shared.Domain
      - Shared.Application
    RepositoryTracking.Infrastructure:
      - RepositoryTracking.Domain
      - RepositoryTracking.Application
      - Shared.Domain
      - Shared.Application
      - Shared.Infrastructure

    # ===== Releases
    Releases.Domain:
      - Shared.Domain
    Releases.Application:
      - Releases.Domain
      - Shared.Domain
      - Shared.Application
    Releases.Infrastructure:
      - Releases.Domain
      - Releases.Application
      - Shared.Domain
      - Shared.Application
      - Shared.Infrastructure

    # ===== Scanning (orchestrator). In Epic B it gained cross-context port edges to
    # Releases.Domain + RepositoryTracking.Domain (architecture §5). It has no Domain
    # layer of its own; it dispatches NewReleaseDetected, which is owned by Releases (the
    # context that owns the Release VO the event carries — see the event's docblock), so
    # the only cross-context edges it needs are Releases.Domain + RepositoryTracking.Domain.
    Scanning.Application:
      - Shared.Domain
      - Shared.Application
      - Releases.Domain               # B4: catches RateLimitException; A1: constructs/dispatches NewReleaseDetected (owned by Releases.Domain)
      - RepositoryTracking.Domain     # B4: ScanReleasesHandler uses ScanCandidateSource + ScanProgressWriter ports
    Scanning.Infrastructure:
      - Scanning.Application          # B4: ScannerCliRunner dispatches ScanReleasesCommand
      - Shared.Domain
      - Shared.Application
      - Shared.Infrastructure

    # ===== Notification\Publishing. Its Domain stays free of cross-context edges:
    # SendReleaseEmail/ReleaseSnapshot are deliberately decoupled from Releases so the
    # wire message can cross the queue boundary. The one cross-context edge it needs is
    # at the Infrastructure layer:
    #  - NotificationPublishing.Infrastructure -> Subscription.Domain + Releases.Domain:
    #    WhenNewReleaseDetectedThenPublishReleaseEmails (Infrastructure\Listener — see
    #    its docblock for why it lives here, not in .Application: it depends on
    #    SendReleaseEmailFactoryInterface, an Infrastructure\Factory port, and an
    #    Application placement would invert the dependency rule) consumes the
    #    Releases-owned NewReleaseDetected, resolves recipients via
    #    SubscriberFinder/SubscriberCollection/SubscriberRef (Subscription.Domain) and
    #    maps the event's Release into this context's own ReleaseSnapshot (Releases.Domain).
    NotificationPublishing.Domain:
      - Shared.Domain
    NotificationPublishing.Application:
      - NotificationPublishing.Domain
      - Shared.Domain
      - Shared.Application
    NotificationPublishing.Infrastructure:
      - NotificationPublishing.Domain
      - NotificationPublishing.Application
      - Shared.Domain
      - Shared.Application
      - Shared.Infrastructure
      - Subscription.Domain           # C2: WhenNewReleaseDetectedThenPublishReleaseEmails uses SubscriberFinder/SubscriberCollection/SubscriberRef
      - Releases.Domain               # C2: maps the event's Releases\Sourcing\Domain\Release into this context's ReleaseSnapshot

    # ===== Notification\Sending (extracted service)
    NotificationSending.Domain:
      - Shared.Domain
    NotificationSending.Application:
      - NotificationSending.Domain
      - Shared.Domain
      - Shared.Application
    NotificationSending.Infrastructure:
      - NotificationSending.Domain
      - NotificationSending.Application
      - Shared.Domain
      - Shared.Application
      - Shared.Infrastructure

    # ===== apps/monolith: the monolith composition root — wires every monolith
    # context's layers + Shared + Legacy (during the transition).
    Apps.Monolith:
      - Shared.Domain
      - Shared.Application
      - Shared.Infrastructure
      - Subscription.Domain
      - Subscription.Application
      - Subscription.Infrastructure
      - RepositoryTracking.Domain
      - RepositoryTracking.Application
      - RepositoryTracking.Infrastructure
      - Releases.Domain
      - Releases.Application
      - Releases.Infrastructure
      - Scanning.Application
      - Scanning.Infrastructure
      - NotificationPublishing.Domain
      - NotificationPublishing.Application
      - NotificationPublishing.Infrastructure
      - Legacy.Domain
      - Legacy.Application
      - Legacy.Infrastructure

    # ===== apps/notification (extracted service): MUST NOT reach monolith-only
    # contexts. Allowed: Shared + NotificationSending only. Fully bites in Epic D.
    Apps.Notification:
      - Shared.Domain
      - Shared.Application
      - Shared.Infrastructure
      - NotificationSending.Domain
      - NotificationSending.Application
      - NotificationSending.Infrastructure

    # ===== Legacy transitional code (drains over Epic B). Its current
    # Domain->Infra and Application->Infra leaks are absorbed by the baseline.
    Legacy.Domain:
      - Shared.Domain
    Legacy.Application:
      - Legacy.Domain
      - Shared.Domain
      - Shared.Application
    Legacy.Infrastructure:
      - Legacy.Domain
      - Legacy.Application
      - Shared.Domain
      - Shared.Application
      - Shared.Infrastructure
      - Subscription.Application       # B1: ReleaseNotifierService news the commands/queries/responses
