deptrac:
  paths:
    - ./src

  layers:
    - name: Notification.Domain
      collectors:
        - type: directory
          value: src/Sending/Domain/.*

    - name: Notification.Application
      collectors:
        - type: directory
          value: src/Sending/Application/.*

    - name: Notification.Infrastructure
      collectors:
        - type: directory
          value: src/Sending/Infrastructure/.*

    - name: Shared
      collectors:
        - type: directory
          value: src/Shared/.*

  ruleset:
    Notification.Domain: []
    Notification.Application:
      - Notification.Domain
    Notification.Infrastructure:
      - Notification.Domain
      - Notification.Application
      - Shared
    Shared: []
