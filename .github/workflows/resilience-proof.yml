name: Scanner Smoke and Resilience Proof

on:
  push:
  pull_request:

jobs:
  scanner-smoke-and-resilience-proof:
    name: scanner-smoke + AC5 / NFR3 outage recovery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RESILIENCE_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Run scanner smoke
        run: make scanner-smoke

      - name: Run resilience proof
        run: make resilience-proof
