name: Architecture

on:
  push:
  pull_request:

jobs:
  deptrac:
    name: deptrac (bounded-context boundaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run deptrac (monolith)
        run: make deptrac

      - name: Run deptrac (notification service)
        run: make notification-deptrac
